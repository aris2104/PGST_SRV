<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    
    <!-- Couleurs d'interface et d'application -->
    <meta name="theme-color" content="#24365A" />
    <meta name="description" content="Plateforme de Gestion des Servants" />

    <!-- Configuration Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Compatibilité iOS / Safari PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PGST" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Compatibilité Android / Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Icônes -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <title>PGST - Gestion des Servants</title>
  </head>
  <body class="bg-surface">
    <div id="root"></div>
    <div
      id="splash"
      style="
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #24365A;
      "
    >
      <div
        style="
          width: 40px; height: 40px; border-radius: 9999px;
          border: 3px solid rgba(255,255,255,0.25);
          border-top-color: #fff;
          animation: pgst-spin 0.8s linear infinite;
        "
      ></div>
    </div>
    <style>
      @keyframes pgst-spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
